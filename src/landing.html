<!--
  The entry page. Rendered by build.py to dist/index.html; the document
  itself lives at dist/doc/.

  It is deliberately its own small page rather than a screen inside the
  document: the document is a 1.5 MB bundle plus 5.7 MB of portraits, and
  the first thing a visitor meets should be on screen immediately. Fonts
  are the same faces the document uses, extracted from the bundle into
  fonts/ so this page makes no third-party request either.

  __FONT_CSS__, __STRINGS__, __TITLE__, __META__, __LANGS__ are filled in
  by build.py. Copy lives in src/i18n.json, not here.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
__META__
<style>
__FONT_CSS__

* { box-sizing: border-box; }
html { background: #04081a; }
body {
  margin: 0; min-height: 100svh; background: #04081a; color: #fff;
  font-family: Heebo, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
::selection { background: #c8102e; color: #fff; }
/* Arabic is outside Heebo's coverage, so it falls to the system face and
   would otherwise render a size smaller than everything around it. */
:root:lang(ar) body, body:lang(ar) { font-family: 'Noto Naskh Arabic', 'Geeza Pro', 'Segoe UI', system-ui, sans-serif; }

.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(120% 85% at 82% 0%, oklch(0.26 0.07 268), transparent 66%),
    radial-gradient(ellipse 120% 85% at 50% 50%, transparent 42%, rgba(0,0,0,0.62) 100%),
    #04081a;
}

/* The picker sits in the same corner, at the same size, as the one inside
   the document, so changing language here does not look like a different
   control from the one there. */
.lang {
  /* Physical left, not inset-inline-start: the picker holds the same corner
     as the document's, which does not move when the page turns RTL. */
  position: fixed; z-index: 9; top: 14px; left: 10px;
  display: flex; align-items: center; gap: 2px;
  background: rgba(4,8,26,0.94); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.3);
  box-shadow: 0 6px 20px rgba(0,0,0,0.5); padding: 3px;
}
/* The globe says what the two-letter codes are for. */
.lang .globe { display: flex; align-items: center; padding: 0 5px 0 3px; color: #8b97c4; flex: none; }
.lang button {
  cursor: pointer; border: 0; padding: 6px 9px; background: transparent; color: #c3cbe6;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 12.5px; font-weight: 500; letter-spacing: .06em; line-height: 1;
  transition: background .2s ease, color .2s ease;
}
.lang button:hover { background: #c8102e; color: #fff; }
.lang button[aria-current="true"] { background: #c8102e; color: #fff; }

main {
  position: relative; z-index: 1; flex: 1;
  width: 100%; max-width: 860px; margin: 0 auto;
  padding: clamp(84px, 14vh, 150px) clamp(20px, 6vw, 40px) clamp(40px, 8vh, 80px);
  display: flex; flex-direction: column; justify-content: center;
}

.kicker {
  display: flex; align-items: center; gap: 10px;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: clamp(9px, 2.4vw, 11px); font-weight: 500; letter-spacing: .18em;
  color: #ff5a6e; text-transform: uppercase;
}
.kicker::after { content: ""; flex: 1; height: 1px; background: rgba(255,90,110,0.34); }

h1 {
  margin: 18px 0 0; font-weight: 900;
  font-size: clamp(38px, 10.5vw, 96px); line-height: 0.98; letter-spacing: -0.03em;
}
h1 .hl { color: #ff5a6e; }

.lead {
  margin: clamp(18px, 3.4vh, 30px) 0 0; max-width: 40em;
  font-size: clamp(15px, 4.1vw, 21px); font-weight: 300; line-height: 1.72; color: #c3cbe6;
}

.now {
  margin-top: clamp(30px, 6vh, 54px);
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.03);
  padding: clamp(18px, 4.4vw, 28px);
  display: flex; align-items: center; justify-content: space-between;
  gap: clamp(16px, 4vw, 34px); flex-wrap: wrap;
  transition: border-color .25s ease, background .25s ease;
}
.now:hover { border-color: rgba(255,90,110,0.5); background: rgba(255,255,255,0.05); }
.now { color: inherit; text-decoration: none; }
/* Grow to fill, shrink to 300px, then let the button drop below it. */
.now-text { flex: 1 1 300px; min-width: 0; }
.now-label, .now-title, .now-sub { display: block; }
.now-label {
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 10px; font-weight: 500; letter-spacing: .16em; color: #8b97c4; text-transform: uppercase;
}
.now-title {
  margin-top: 9px; font-size: clamp(21px, 5.6vw, 31px); font-weight: 800;
  line-height: 1.12; letter-spacing: -0.02em;
}
.now-sub { margin-top: 7px; font-size: clamp(13px, 3.5vw, 15px); font-weight: 300; color: #8b97c4; line-height: 1.5; }

.enter {
  flex: none; display: inline-flex; align-items: center; gap: 9px;
  background: #c8102e; color: #fff; text-decoration: none;
  padding: 15px clamp(18px, 4.6vw, 28px);
  font-family: Heebo, system-ui, sans-serif; font-size: clamp(14px, 3.8vw, 16px);
  font-weight: 700; letter-spacing: .01em; line-height: 1;
  transition: background .2s ease, transform .2s ease;
}
.enter:hover { background: #ff5a6e; transform: translateY(-1px); }
.enter .arw { font-size: 1.15em; line-height: 1; }
/* The arrow points into the page, which is leftwards in Hebrew and Arabic. */
[dir="rtl"] .enter .arw { transform: scaleX(-1); }

/* ── The response block ───────────────────────────────────────────────────
   A quoted denial, given as a denial: the words, who said them, and what
   they were answering. The cut-out portraits are the same treatment the
   document gives every speaker. */
.news {
  margin-top: clamp(16px, 3vh, 22px);
  border: 1px solid rgba(255,255,255,0.16);
  background: rgba(255,255,255,0.03);
  display: grid; grid-template-columns: minmax(0, 34%) minmax(0, 1fr);
  align-items: end; gap: clamp(14px, 3vw, 26px);
  padding: clamp(18px, 4.4vw, 28px);
}
.news-art { margin: 0; align-self: end; }
.news-art img {
  display: block; width: 100%; height: auto;
  filter: grayscale(1) contrast(1.06);
  /* The photo is a cut-out on transparency, so it sits straight on the
     page rather than on a plate. */
}
.news-label {
  display: block;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 10px; font-weight: 500; letter-spacing: .16em;
  color: #ff5a6e; text-transform: uppercase;
}
.news-pull {
  margin: 10px 0 0; font-size: clamp(19px, 5vw, 27px); font-weight: 800;
  line-height: 1.22; letter-spacing: -0.02em;
}
.news-pull::before { content: "\201D"; }
.news-pull::after { content: "\201C"; }
[dir="ltr"] .news-pull::before { content: "\201C"; }
[dir="ltr"] .news-pull::after { content: "\201D"; }
.news-quote {
  margin: 12px 0 0; font-size: clamp(13.5px, 3.6vw, 16px); font-weight: 300;
  line-height: 1.65; color: #c3cbe6;
}
.news-attr {
  margin: 12px 0 0; font-size: clamp(11.5px, 3.1vw, 13px); font-weight: 400;
  line-height: 1.5; color: #7a86b4;
}
.news-note {
  margin: 16px 0 0; padding-inline-start: 12px;
  border-inline-start: 3px solid #c8102e;
  font-size: clamp(13.5px, 3.6vw, 16px); font-weight: 500; line-height: 1.5;
}
/* The second voice: one line, a face and the recording it came from. */
.news-sm { grid-template-columns: minmax(0, 29%) minmax(0, 1fr); align-items: end; }
.news-sm .news-pull { font-size: clamp(17px, 4.4vw, 23px); }
.news-listen {
  display: inline-flex; align-items: center; gap: 7px; margin-top: 12px;
  color: #ff5a6e; text-decoration: none;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: clamp(10.5px, 2.9vw, 12px); font-weight: 500; letter-spacing: .04em;
  border-bottom: 1px solid rgba(255,90,110,0.4); padding-bottom: 2px;
  transition: color .2s ease, border-color .2s ease;
}
.news-listen:hover { color: #fff; border-color: #fff; }
.news-listen svg { flex: none; }

@media (max-width: 620px) {
  /* Two columns leave the portraits too small to read a face in. */
  .news { grid-template-columns: 1fr; align-items: start; }
  .news-art { max-width: 260px; margin-inline: auto; }
  .news-sm .news-art { max-width: 150px; margin-inline: 0; }
}

.soon {
  margin-top: clamp(16px, 3vh, 22px);
  border: 1px dashed rgba(255,255,255,0.2);
  padding: clamp(16px, 4.2vw, 24px);
}
.soon-label {
  display: inline-block;
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
  font-size: 10px; font-weight: 500; letter-spacing: .16em; color: #fbe94f; text-transform: uppercase;
}
.soon-label::before {
  content: ""; display: inline-block; vertical-align: middle;
  width: 6px; height: 6px; border-radius: 50%; background: #fbe94f;
  margin-inline-end: 8px; animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
.soon-head { margin-top: 9px; font-size: clamp(16px, 4.3vw, 20px); font-weight: 700; line-height: 1.3; }
/* Hebrew and Arabic have no case and no tracking convention; the caps-lock
   spacing that sets a Latin label apart just pulls their letters off each
   other. */
[dir="rtl"] .now-label, [dir="rtl"] .soon-label { letter-spacing: .04em; }
/* Arabic letters join. Any tracking at all pulls them apart. */
:lang(ar) .now-label, :lang(ar) .soon-label, :lang(ar) .kicker { letter-spacing: 0; }
.soon-note { margin-top: 6px; font-size: clamp(12.5px, 3.4vw, 14px); font-weight: 300; color: #7a86b4; line-height: 1.6; }

footer {
  position: relative; z-index: 1;
  padding: 0 clamp(20px, 6vw, 40px) clamp(22px, 4vh, 34px);
  max-width: 860px; margin: 0 auto; width: 100%;
  font-size: clamp(11px, 3vw, 12.5px); font-weight: 300; line-height: 1.65; color: #56618f;
}

@media (max-width: 560px) {
  .lang { top: 8px; left: 6px; }
  .lang button { padding: 5px 7px; font-size: 11px; }
  .lang .globe { display: none; }
  .now { align-items: stretch; }
  .enter { width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; transition-duration: .001s !important; } }
</style>

<div class="bg"></div>

<nav class="lang" id="lang" aria-label="Language"></nav>

<main>
  <div class="kicker">october7.co</div>
  <h1 id="k-title"></h1>
  <p class="lead" id="k-lead"></p>

  <a class="now" id="enter-card" href="doc/">
    <span class="now-text">
      <span class="now-label" id="k-nowlabel"></span>
      <span class="now-title" id="k-doctitle"></span>
      <span class="now-sub" id="k-docsub"></span>
    </span>
    <span class="enter"><span id="k-enter"></span><span class="arw">&#8594;</span></span>
  </a>

  <section class="news">
    <figure class="news-art">
      <img src="assets/mbz-netanyahu.png" alt="" width="1200" height="864" decoding="async">
    </figure>
    <div class="news-text">
      <span class="news-label" id="k-newslabel"></span>
      <blockquote class="news-pull" id="k-newspull"></blockquote>
      <p class="news-quote" id="k-newsquote"></p>
      <p class="news-attr" id="k-newsattr"></p>
      <p class="news-note" id="k-newsnote"></p>
    </div>
  </section>

  <section class="news news-sm">
    <figure class="news-art">
      <img src="assets/bennett.png" alt="" width="760" height="615" decoding="async" loading="lazy">
    </figure>
    <div class="news-text">
      <span class="news-label" id="k-benlabel"></span>
      <blockquote class="news-pull" id="k-benpull"></blockquote>
      <p class="news-attr" id="k-benattr"></p>
      <a class="news-listen" id="k-benlink" target="_blank" rel="noopener"
         href="https://glz.co.il/%D7%92%D7%9C%D7%A6/%D7%AA%D7%95%D7%9B%D7%A0%D7%99%D7%95%D7%AA/%D7%91%D7%95%D7%A7%D7%A8-%D7%98%D7%95%D7%91-%D7%99%D7%A9%D7%A8%D7%90%D7%9C/%D7%91%D7%95%D7%A7%D7%A8-%D7%98%D7%95%D7%91-%D7%99%D7%A9%D7%A8%D7%90%D7%9C-08-09-2026-0600/">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6.2v3.6M6 3.6v8.8M9 5v6M12 7v2"/></svg>
        <span></span>
      </a>
    </div>
  </section>

  <div class="soon">
    <span class="soon-label" id="k-soonlabel"></span>
    <div class="soon-head" id="k-soon"></div>
    <div class="soon-note" id="k-soonnote"></div>
  </div>
</main>

<footer id="k-foot"></footer>

<script>
var S = __STRINGS__;
var KEYS = __LANGS__;

function initial() {
  try {
    var saved = window.localStorage.getItem('oct7.lang');
    if (saved && S[saved]) return saved;
  } catch (e) { /* private mode */ }
  // A visitor arriving in a language we publish gets it without asking.
  var nav = (navigator.languages || [navigator.language || '']);
  for (var i = 0; i < nav.length; i++) {
    var c = String(nav[i]).slice(0, 2).toLowerCase();
    if (c === 'iw') c = 'he';
    if (S[c]) return c;
  }
  return 'he';
}

function set(id, text) { document.getElementById(id).textContent = text || ''; }

function apply(k) {
  var t = S[k] || S.he;
  document.documentElement.lang = k;
  document.documentElement.dir = t.dir || 'rtl';
  document.title = t.landTitle;
  set('k-title', t.landTitle);
  set('k-lead', t.landLead);
  set('k-nowlabel', t.landNowLabel);
  set('k-doctitle', (t.t1 + ' ' + t.t2).trim());
  set('k-docsub', t.subtitle + ' \u00b7 ' + t.issued);
  set('k-enter', t.landEnter);
  set('k-newslabel', t.landNewsLabel);
  set('k-newspull', t.landNewsPull);
  set('k-newsquote', t.landNewsQuote);
  set('k-newsattr', t.landNewsAttr);
  set('k-newsnote', t.landNewsNote);
  // A translated quotation is not the quotation. The Hebrew the man
  // actually said stays one hover away in every other language.
  var he = S.he;
  document.getElementById('k-newspull').title = k === 'he' ? '' : he.landNewsPull;
  document.getElementById('k-newsquote').title = k === 'he' ? '' : he.landNewsQuote;
  set('k-benlabel', t.landBennettLabel);
  set('k-benpull', t.landBennettPull);
  set('k-benattr', t.landBennettAttr);
  document.querySelector('#k-benlink span').textContent = t.landBennettLink;
  document.getElementById('k-benpull').title = k === 'he' ? '' : he.landBennettPull;
  set('k-soonlabel', t.landSoonLabel);
  set('k-soon', t.landSoon);
  set('k-soonnote', t.landSoonNote);
  set('k-foot', t.landFoot);
  // The document reads the same key on load, so a choice made here is the
  // language it opens in.
  try { window.localStorage.setItem('oct7.lang', k); } catch (e) { /* private mode */ }
  var b = document.querySelectorAll('#lang button');
  for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-current', b[i].dataset.k === k ? 'true' : 'false');
}

(function () {
  var nav = document.getElementById('lang');
  nav.insertAdjacentHTML('afterbegin',
    '<span class="globe"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" '
    + 'stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="6.2"/>'
    + '<ellipse cx="8" cy="8" rx="2.7" ry="6.2"/><path d="M2 6h12M2 10h12"/></svg></span>');
  KEYS.forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.dataset.k = k;
    b.lang = k;
    b.title = (S[k] || {}).label || k;
    b.setAttribute('aria-label', (S[k] || {}).label || k);
    b.textContent = k.toUpperCase();
    b.onclick = function () { apply(k); };
    nav.appendChild(b);
  });
  apply(initial());
})();
</script>
