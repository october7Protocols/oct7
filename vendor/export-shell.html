document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02Fdiv>\n<div style=\"position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 120% 85% at 50% 50%, transparent 42%, rgba(0,0,0,0.62) 100%)\"><\u002Fdiv>\n\n<div style=\"position:fixed;top:0;right:0;left:0;height:4px;z-index:80;background:rgba(255,255,255,0.07)\">\n  <div ref=\"{{ barRef }}\" style=\"height:100%;width:0%;background:#c8102e\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div ref=\"{{ hudRef }}\" style=\"position:fixed;z-index:71;top:14px;right:10px;width:var(--rail);opacity:0;transform:translateY(-10px);transition:opacity .5s ease, transform .5s ease;pointer-events:none\">\n  <div style=\"width:100%;background:rgba(0,0,0,0.74);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.16)\">\n    <div style=\"padding:5px 6px 6px;border-bottom:1px solid rgba(255,255,255,0.14)\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:#8b97c4;line-height:1.3\">תאריך<\u002Fdiv>\n      <div ref=\"{{ hudDateRef }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(10px,1.1vw,13px);color:#fff;letter-spacing:.02em;line-height:1.25\">—<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:5px 6px 6px;background:rgba(200,16,46,0.24)\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:#ffb3bd;line-height:1.3\">ימים ל־7.10<\u002Fdiv>\n      <div ref=\"{{ hudDaysRef }}\" style=\"font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:clamp(11px,1.3vw,15px);color:#ff5a6e;letter-spacing:.02em;line-height:1.2\">—<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div ref=\"{{ railRef }}\" style=\"position:fixed;z-index:72;top:160px;bottom:40px;right:10px;width:var(--rail);overflow:visible;pointer-events:none;opacity:1\">\n  <div style=\"position:absolute;top:0;bottom:0;right:19px;width:1px;background:rgba(139,151,196,0.26)\"><\u002Fdiv>\n  <div ref=\"{{ railFillRef }}\" style=\"position:absolute;top:0;right:18px;width:3px;height:0;background:linear-gradient(to bottom,rgba(139,151,196,0.5),#ff5a6e);box-shadow:0 0 7px rgba(255,90,110,0.45)\"><\u002Fdiv>\n  <sc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"12\">\n    <div style=\"position:absolute;top:{{ t.top }};margin-top:-24px;right:0;display:flex;align-items:center;justify-content:flex-start;gap:16px;height:24px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ t.go }}\" title=\"{{ t.title }}\" style=\"cursor:pointer;pointer-events:auto;background:{{ t.tickColor }};border:0;width:24px;height:3px;padding:0;flex:0 0 auto;opacity:0;animation:omStopIn .6s {{ t.delay }} cubic-bezier(.2,.9,.2,1) both;transition:opacity .3s ease, background .2s ease\" style-hover=\"background:#ff7a8e\" style-focus=\"outline:2px solid #ff5a6e;outline-offset:2px\"><\u002Fbutton>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:{{ t.labelSize }};font-weight:500;letter-spacing:.04em;color:{{ t.labelColor }};white-space:nowrap;line-height:1\">{{ t.yearLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <div ref=\"{{ railDotRef }}\" style=\"position:absolute;right:-14px;width:14px;height:14px;margin-top:-7px;opacity:1\">\n    <div style=\"position:absolute;inset:0;border-radius:50%;background:#ff5a6e;animation:omDotPulse 2.6s ease-in-out infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;top:50%;right:16px;width:clamp(12px,2vw,30px);height:1px;margin-top:-0.5px;background:linear-gradient(to left,rgba(255,90,110,0.95),transparent)\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<header style=\"position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vh,36px);max-width:1240px;margin:0 auto;padding:clamp(26px,6vw,80px)\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n    <span style=\"display:inline-block;background:#c8102e;color:#fff;font-weight:800;font-size:clamp(12px,1.5vw,16px);letter-spacing:.06em;padding:7px 16px\">בלמ״ס · מלחמת התקומה<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.12em;color:#8b97c4\">דצמבר 2025<\u002Fspan>\n  <\u002Fdiv>\n\n  <h1 style=\"margin:0;font-weight:900;font-size:clamp(44px,9.4vw,138px);line-height:0.9;letter-spacing:-0.045em;text-wrap:balance\">\n    תיק<br><span style=\"color:#ff5a6e\">7 באוקטובר<\u002Fspan>\n  <\u002Fh1>\n  <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n    <div style=\"height:3px;width:clamp(40px,7vw,90px);background:#c8102e\"><\u002Fdiv>\n    <div style=\"font-weight:700;font-size:clamp(15px,1.9vw,24px);color:#e7ebf8;letter-spacing:-0.01em\">מענה ראש הממשלה לשאלות מבקר המדינה<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:0;max-width:52ch;font-size:clamp(18px,2.2vw,28px);line-height:1.55;color:#c3cbe6;font-weight:300;text-wrap:pretty\">\n    אתם עומדים להיכנס לחדר. שאלות המבקר, מענה ראש הממשלה, והדיונים הביטחוניים עצמם — דובר אחר דובר, בלשונם.\n  <\u002Fp>\n\n  <nav style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:clamp(6px,2vh,20px)\">\n    <sc-for list=\"{{ toc }}\" as=\"t\" hint-placeholder-count=\"10\">\n      <a href=\"#{{ t.anchor }}\" style=\"display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,0.06);font-size:14.5px;color:#c3cbe6;font-weight:500\" style-hover=\"background:#c8102e;color:#fff\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;color:#ff5a6e;font-size:12px\">{{ t.num }}<\u002Fspan>{{ t.title }}\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fnav>\n\n  <div style=\"display:flex;align-items:center;gap:10px;color:#8b97c4;font-size:14px;margin-top:auto;padding-top:22px\">\n    <span style=\"display:inline-block;width:2px;height:26px;background:#c8102e;animation:omPulse 2.4s ease-in-out infinite\"><\u002Fspan>\n    גללו כדי להיכנס\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"prologue\" style=\"position:relative;z-index:3;background:#000\">\n  <div style=\"min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.4vh,26px);max-width:1240px;margin:0 auto;padding:clamp(40px,10vh,110px) clamp(20px,5vw,80px)\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(11px,1.3vw,13px);letter-spacing:.2em;color:#8b97c4\">לפני שנפתח את המסמך<\u002Fdiv>\n    <p style=\"margin:0;max-width:34ch;font-weight:800;font-size:clamp(24px,4.4vw,58px);line-height:1.18;letter-spacing:-0.03em;color:#fff;text-wrap:balance\">\n      אלה הדברים שנאמרו לראש הממשלה על חמאס — עם התאריך שבו נאמרו.\n    <\u002Fp>\n    <p style=\"margin:0;max-width:44ch;font-size:clamp(16px,1.9vw,22px);line-height:1.6;color:#b8c1de;font-weight:300\">כל ציטוט בעמודים הבאים מופיע במסמך, ואושר לפרסום בידי ראש הממשלה. הספירה היא עד שבת בבוקר, 7 באוקטובר 2023.<\u002Fp>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ prologue }}\" as=\"p\" hint-placeholder-count=\"9\">\n    <div data-beat=\"1\" style=\"position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;background:{{ p.bg }};content-visibility:auto;contain-intrinsic-size:auto 100vh\">\n      <div data-anim=\"pulse\" style=\"position:absolute;top:50%;left:50%;width:min(120vw,1200px);height:min(120vw,1200px);transform:translate(-50%,-50%);pointer-events:none;border-radius:50%;background:radial-gradient(circle,{{ p.glow }},transparent 62%);opacity:.18;animation:omBreathe 6s ease-in-out infinite\"><\u002Fdiv>\n\n      <div style=\"position:relative;z-index:2;width:100%;max-width:1240px;margin:0 auto;padding:clamp(30px,7vh,80px) clamp(20px,5vw,80px);display:flex;flex-direction:column;gap:clamp(16px,3vh,34px)\">\n        <div data-anim=\"count\" style=\"display:flex;align-items:baseline;gap:clamp(10px,1.6vw,18px);flex-wrap:wrap\">\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:clamp(56px,15vw,190px);line-height:0.8;letter-spacing:-0.05em;color:{{ p.numColor }}\">{{ p.days }}<\u002Fspan>\n          <span style=\"font-weight:800;font-size:clamp(15px,2.1vw,28px);line-height:1.2;color:#fff;max-width:14ch\">{{ p.unit }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div data-anim=\"rule\" style=\"height:3px;width:100%;max-width:520px;background:{{ p.numColor }};transform-origin:right center\"><\u002Fdiv>\n\n        <div data-anim=\"line\" style=\"display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);max-width:min(100%,40ch)\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px\">\n            <span style=\"display:inline-block;background:{{ p.tagBg }};color:#fff;font-weight:800;font-size:clamp(12px,1.4vw,16px);padding:6px 14px\">{{ p.who }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(11.5px,1.3vw,14px);color:#8b97c4;letter-spacing:.06em\">{{ p.date }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-weight:700;font-size:clamp(19px,2.7vw,40px);line-height:1.34;letter-spacing:-0.02em;color:#fff;text-wrap:pretty\">{{ p.quote }}<\u002Fp>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(11px,1.2vw,13px);color:#8b97c4;line-height:1.6\">{{ p.src }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <div data-beat=\"1\" style=\"position:relative;min-height:100vh;display:flex;align-items:center;background:#000;content-visibility:auto;contain-intrinsic-size:auto 100vh\">\n    <div style=\"width:100%;max-width:1240px;margin:0 auto;padding:clamp(30px,7vh,80px) clamp(20px,5vw,80px);display:flex;flex-direction:column;gap:clamp(18px,3.4vh,40px)\">\n      <div data-anim=\"count\" style=\"font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:clamp(62px,17vw,220px);line-height:0.8;letter-spacing:-0.05em;color:#c8102e\">06:29<\u002Fdiv>\n      <div data-anim=\"rule\" style=\"height:3px;width:100%;max-width:520px;background:#c8102e;transform-origin:right center\"><\u002Fdiv>\n      <div data-anim=\"line\" style=\"display:flex;flex-direction:column;gap:14px;max-width:min(100%,36ch)\">\n        <p style=\"margin:0;font-weight:800;font-size:clamp(22px,3.4vw,50px);line-height:1.2;letter-spacing:-0.03em;color:#fff\">שבת, 7 באוקטובר 2023. שיחת ווטסאפ מהמזכיר הצבאי מעדכנת את ראש הממשלה על פתיחת המתקפה.<\u002Fp>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:clamp(11px,1.2vw,13px);color:#8b97c4;line-height:1.6\">(פרק 7 במסמך — יום ה-7 באוקטובר 2023)<\u002Fdiv>\n      <\u002Fdiv>\n      <a href=\"#cast\" style=\"align-self:flex-start;margin-top:clamp(10px,2vh,24px);padding:13px 24px;background:#c8102e;color:#fff;font-weight:700;font-size:clamp(14px,1.6vw,17px)\" style-hover=\"background:#fff;color:#c8102e\">להיכנס למסמך ↓<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cast\" style=\"position:relative;z-index:3;max-width:1240px;margin:0 auto;padding:clamp(40px,8vh,90px) clamp(20px,5vw,80px)\">\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(96px,11vw,150px),1fr));gap:clamp(8px,1.4vw,16px)\">\n    <sc-for list=\"{{ cast }}\" as=\"c\" hint-placeholder-count=\"12\">\n      <div>\n        <div style=\"position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;filter:grayscale(1) sepia(0.5) saturate(1.5) contrast(1.6) brightness(1.04);background:repeating-linear-gradient(45deg,rgba(255,255,255,0.07) 0 6px,transparent 6px 12px)\">\n          <image-slot id=\"cast-{{ c.key }}\" shape=\"rect\" fit=\"cover\" placeholder=\"{{ c.name }}\"><\u002Fimage-slot>\n          <div style=\"position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:0.6;background-image:radial-gradient(circle at 0.9px 0.9px, rgba(0,0,0,0.55) 0.72px, transparent 0.95px);background-size:2.6px 2.6px\"><\u002Fdiv>\n          <div style=\"position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:0.55;background-image:repeating-linear-gradient(52deg,rgba(0,0,0,0.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(-38deg,rgba(255,255,255,0.18) 0 1px,transparent 1px 4px)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ c.go }}\" title=\"{{ c.jumpTitle }}\" style=\"display:block;width:100%;margin-top:7px;padding:0;background:none;border:0;font:inherit;text-align:right;cursor:pointer;color:inherit\" style-hover=\"opacity:0.75\">\n          <div style=\"display:flex;align-items:baseline;gap:5px\">\n            <div style=\"font-weight:700;font-size:clamp(12px,1.3vw,14.5px);color:#fff;line-height:1.25\">{{ c.name }}<\u002Fdiv>\n            <span style=\"font-size:11px;color:#ff5a6e\">←<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:clamp(11px,1.15vw,12.5px);color:#8b97c4;line-height:1.3;margin-top:2px\">{{ c.role }}<\u002Fdiv>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<main style=\"position:relative;z-index:3\">\n  <sc-for list=\"{{ chapters }}\" as=\"ch\" hint-placeholder-count=\"3\">\n    <section id=\"{{ ch.anchor }}\" data-chapter=\"{{ ch.idx }}\" data-tint=\"{{ ch.tint }}\" data-screen-label=\"{{ ch.label }}\" style=\"position:relative\">\n\n      <div style=\"min-height:88vh;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,2.6vh,30px);max-width:1240px;margin:0 auto;padding:clamp(50px,10vh,120px) clamp(20px,5vw,80px)\">\n        <sc-if value=\"{{ ch.numbered }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"display:inline-block;background:#c8102e;color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:clamp(13px,1.6vw,17px);padding:6px 14px;letter-spacing:.08em\">פרק {{ ch.num }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7a86b4;letter-spacing:.1em\">עמוד {{ ch.page }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <h2 style=\"margin:0;font-weight:900;font-size:clamp(32px,6.2vw,92px);line-height:1.02;letter-spacing:-0.03em;text-wrap:balance;max-width:24ch\">{{ ch.title }}<\u002Fh2>\n        <div style=\"height:5px;width:clamp(70px,12vw,160px);background:#c8102e\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ ch.hasQuestions }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,80px) clamp(40px,8vh,90px)\">\n          <div style=\"display:grid;grid-template-columns:clamp(78px,11vw,150px) 1fr;gap:clamp(16px,2.6vw,34px);align-items:start;background:linear-gradient(180deg,rgba(255,255,255,0.075),rgba(255,255,255,0.03));padding:clamp(18px,2.8vw,32px)\">\n            <div style=\"position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;filter:grayscale(1) contrast(1.08);background:repeating-linear-gradient(45deg,rgba(255,255,255,0.07) 0 6px,transparent 6px 12px)\">\n              <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#7a86b4;text-align:center;padding:6px\">מתניהו אנגלמן<\u002Fdiv>\n              <div data-portrait=\"comptroller\" style=\"position:absolute;inset:0;background-size:cover;background-position:center 22%;background-repeat:no-repeat\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"min-width:0\">\n              <div style=\"display:inline-block;background:#3d4f8f;color:#fff;font-weight:800;font-size:clamp(12.5px,1.5vw,15px);padding:6px 14px;margin-bottom:clamp(13px,2vh,20px)\">שאלות מבקר המדינה<\u002Fdiv>\n              <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:clamp(11px,1.8vh,17px)\">\n                <sc-for list=\"{{ ch.questions }}\" as=\"q\" hint-placeholder-count=\"2\">\n                  <li style=\"font-size:clamp(17px,2.1vw,25px);line-height:1.52;color:#e7ebf8;font-weight:400;text-wrap:pretty;padding-inline-start:16px;border-inline-start:3px solid rgba(255,255,255,0.22)\">{{ q }}<\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ ch.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n          <div data-uid=\"{{ it.uid }}\" data-speaker=\"{{ it.speaker }}\" data-date=\"{{ it.dateLabel }}\" data-days=\"{{ it.daysLabel }}\" data-short=\"{{ it.dateShort }}\" data-daysnum=\"{{ it.daysNum }}\">\n\n            <sc-if value=\"{{ it.isSpeech }}\" hint-placeholder-val=\"{{ false }}\">\n              <div data-stage=\"1\" style=\"position:relative;min-height:clamp(360px,62vh,680px);overflow:hidden;opacity:0.34;transition:opacity 1.1s ease;display:grid;direction:ltr;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:center;justify-content:center;gap:clamp(18px,3.4vw,64px);max-width:1680px;margin:0 auto;padding:clamp(26px,5vh,64px) clamp(20px,4vw,64px)\">\n\n                <div data-anim=\"portrait\" style=\"align-self:center;justify-self:end;position:relative;width:100%;max-width:clamp(200px,31vw,470px)\">\n                  <div style=\"position:relative;display:block;width:100%\">\n                    <img data-portrait=\"{{ it.portrait }}\" alt=\"{{ it.name }}\" style=\"display:block;width:100%;height:auto;filter:grayscale(1) sepia(0.5) saturate(1.5) contrast(1.62) brightness(1.02) drop-shadow(0 18px 40px rgba(0,0,0,0.7))\">\n                    <div data-inkmask=\"1\" style=\"position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:0.72;background-image:radial-gradient(circle at 0.9px 0.9px, rgba(0,0,0,0.62) 0.72px, transparent 0.95px),repeating-linear-gradient(52deg,rgba(0,0,0,0.16) 0 1px,transparent 1px 3px),repeating-linear-gradient(-38deg,rgba(255,255,255,0.14) 0 1px,transparent 1px 4px);background-size:2.6px 2.6px, auto, auto\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top, #04081a 0%, rgba(4,8,26,0.35) 16%, transparent 40%)\"><\u002Fdiv>\n                  <div data-anim=\"sweep\" style=\"position:absolute;top:0;bottom:0;left:0;width:70%;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent)\"><\u002Fdiv>\n                <\u002Fdiv>\n\n                <div dir=\"rtl\" style=\"direction:rtl;min-width:0\">\n                  <div style=\"max-width:min(100%,54ch)\">\n                    <div data-anim=\"label\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:clamp(13px,2.2vh,22px)\">\n                      <span style=\"display:inline-block;background:{{ it.tagBg }};color:#fff;font-weight:800;font-size:clamp(12.5px,1.5vw,17px);padding:7px 15px;letter-spacing:.02em\">{{ it.name }}<\u002Fspan>\n                      <span style=\"font-size:clamp(12.5px,1.4vw,15px);color:#9aa6d0;font-weight:400\">{{ it.role }}<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <div data-anim=\"quote\" style=\"position:relative\">\n                      <p style=\"margin:0;font-weight:700;font-size:clamp(19px,2.6vw,38px);line-height:1.36;letter-spacing:-0.018em;color:#fff;text-wrap:pretty;text-shadow:0 4px 34px rgba(0,0,0,0.7)\">{{ it.quoted }}<\u002Fp>\n                      <div data-veil=\"1\" style=\"position:absolute;inset:0;pointer-events:none;opacity:1;background:linear-gradient(to top,#04081a 2%,rgba(4,8,26,0.76) 30%,transparent 66%);transition:opacity 1.1s ease\"><\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <div data-anim=\"meta\" style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#7a86b4;margin-top:clamp(12px,1.8vh,20px);line-height:1.5\">{{ it.note }}<\u002Fdiv>\n                    <div data-anim=\"meta\" style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b97c4;margin-top:8px;line-height:1.55\">{{ it.source }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isClaim }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(16px,3vh,34px) clamp(20px,5vw,80px)\">\n                <div style=\"max-width:min(100%,46ch);margin-inline-end:auto;border-inline-start:4px solid #c8102e;padding-inline-start:clamp(14px,2.2vw,26px)\">\n                  <p style=\"margin:0;font-size:clamp(17px,2.2vw,29px);line-height:1.55;color:#eef1fa;font-weight:400;text-wrap:pretty\">{{ it.text }}<\u002Fp>\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b97c4;margin-top:10px;line-height:1.55\">{{ it.source }}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#7a86b4;margin-top:7px;line-height:1.55;font-style:italic\">{{ it.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isQuote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(26px,5vh,60px) clamp(20px,5vw,80px)\">\n                <div style=\"filter:drop-shadow(0 26px 60px rgba(0,0,0,0.72));transform:rotate(-0.35deg)\">\n                  <figure style=\"margin:0;background:#fbf9f2;color:#141726;padding:clamp(30px,4.4vw,64px) clamp(22px,3.6vw,56px);clip-path:{{ tornClip }}\">\n                    <div style=\"display:inline-block;background:#141726;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;padding:5px 11px;margin-bottom:clamp(14px,2vh,22px)\">מתוך המסמך<\u002Fdiv>\n\n  \n                    <blockquote style=\"margin:0;font-weight:700;font-size:clamp(17px,2.3vw,30px);line-height:1.85;white-space:pre-line;text-wrap:pretty\">\n                      <span style=\"background:#fbe94f;padding:0.06em 0.14em;box-decoration-break:clone;-webkit-box-decoration-break:clone;box-shadow:0 0 0 0.14em #fbe94f\">{{ it.text }}<\u002Fspan>\n                    <\u002Fblockquote>\n                    <figcaption style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#6d6647;margin-top:clamp(18px,2.6vh,30px);padding-top:14px;border-top:1px solid rgba(20,23,38,0.18);line-height:1.55\">{{ it.source }}<\u002Ffigcaption>\n                  <\u002Ffigure>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isHeading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(40px,9vh,110px) clamp(20px,5vw,80px) clamp(14px,2.4vh,28px)\">\n                <div style=\"display:inline-block;background:#c8102e;color:#fff;font-weight:800;font-size:clamp(14px,1.9vw,24px);padding:10px 18px;max-width:34ch;line-height:1.3;text-wrap:balance\">{{ it.text }}<\u002Fdiv>\n                <div style=\"font-size:14px;color:#7a86b4;margin-top:11px;font-style:italic\">{{ it.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isList }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(16px,3vh,34px) clamp(20px,5vw,80px)\">\n                <div style=\"background:rgba(255,255,255,0.05);border-top:4px solid #3d4f8f;padding:clamp(18px,2.8vw,36px)\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.12em;color:#9aa6d0;margin-bottom:clamp(13px,2vh,20px)\">{{ it.title }}<\u002Fdiv>\n                  <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:clamp(11px,1.7vh,16px)\">\n                    <sc-for list=\"{{ it.items }}\" as=\"li\" hint-placeholder-count=\"3\">\n                      <li style=\"font-size:clamp(16px,2vw,24px);line-height:1.54;color:#e2e7f6;font-weight:300;text-wrap:pretty\">{{ li }}<\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Fol>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isTimeline }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(16px,3vh,34px) clamp(20px,5vw,80px)\">\n                <div style=\"display:grid;grid-template-columns:clamp(78px,11vw,168px) 1fr;gap:clamp(14px,2.4vw,34px);align-items:start;background:linear-gradient(180deg,rgba(200,16,46,0.20),rgba(200,16,46,0.05));border-inline-start:6px solid #c8102e;padding:clamp(18px,3vw,36px)\">\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:clamp(22px,3.4vw,52px);line-height:1;color:#ff5a6e;letter-spacing:-0.03em\">{{ it.time }}<\u002Fdiv>\n                  <div style=\"min-width:0\">\n                    <div style=\"font-weight:800;font-size:clamp(17px,2.1vw,27px);color:#fff;margin-bottom:10px\">{{ it.title }}<\u002Fdiv>\n                    <p style=\"margin:0;font-size:clamp(16px,2vw,24px);line-height:1.58;color:#eef1fa;font-weight:300;white-space:pre-line;text-wrap:pretty\">{{ it.text }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(14px,2.4vh,26px) clamp(20px,5vw,80px)\">\n                <p style=\"margin:0;font-size:clamp(16px,2vw,24px);line-height:1.64;color:#c3cbe6;font-weight:300;padding-inline-start:clamp(14px,2vw,22px);border-inline-start:2px solid rgba(255,255,255,0.18);white-space:pre-line;text-wrap:pretty;max-width:min(100%,50ch);margin-inline-end:auto\">{{ it.text }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isStage }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(10px,2vh,22px) clamp(20px,5vw,80px);text-align:center;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#7a86b4;letter-spacing:.04em\">{{ it.text }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isSource }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(6px,1.2vh,14px) clamp(20px,5vw,80px);font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8b97c4;line-height:1.6\">{{ it.text }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ it.isRedacted }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"max-width:1240px;margin:0 auto;padding:clamp(30px,6vh,70px) clamp(20px,5vw,80px)\">\n                <div style=\"background:#000;border:1px solid rgba(255,255,255,0.12);padding:clamp(24px,4.4vw,60px);text-align:center\">\n                  <div style=\"height:clamp(110px,22vh,260px);background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);margin-bottom:22px\"><\u002Fdiv>\n                  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#8b97c4;line-height:1.7;max-width:46ch;margin:0 auto\">{{ it.text }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n\n  <footer style=\"position:relative;z-index:3;max-width:1240px;margin:0 auto;padding:clamp(60px,12vh,140px) clamp(20px,5vw,80px) clamp(50px,10vh,110px)\">\n    <div style=\"height:4px;width:100%;background:#c8102e;margin-bottom:clamp(24px,4vh,44px)\"><\u002Fdiv>\n    <div style=\"display:inline-block;background:#c8102e;color:#fff;font-weight:800;font-size:14px;padding:7px 15px;margin-bottom:20px\">סוף המסמך<\u002Fdiv>\n    <p style=\"margin:0;max-width:54ch;font-size:clamp(17px,2vw,24px);line-height:1.6;color:#c3cbe6;font-weight:300;text-wrap:pretty\">\n      כל האמור לעיל הוא מענה ראש הממשלה לשאלות מבקר המדינה, כפי שהוגש בדצמבר 2025 — 55 עמודים ו־33 נספחים. חלקים שלא אושרו לפרסום מוצגים כמושחרים.\n    <\u002Fp>\n    <div style=\"margin-top:26px;font-size:15px;color:#7a86b4;line-height:1.7;max-width:54ch\">\n      בדיקת האירועים טרם הושלמה. הדברים המובאים כאן הם טענות ועמדות של ראש הממשלה ושל הדוברים בדיונים — לא קביעות של גוף בודק.\n    <\u002Fdiv>\n    <a href=\"#top\" style=\"display:inline-block;margin-top:32px;padding:12px 22px;background:rgba(255,255,255,0.08);font-size:15px;font-weight:500;color:#fff\" style-hover=\"background:#c8102e\">חזרה לראש העמוד ↑<\u002Fa>\n  <\u002Ffooter>\n<\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;תוכן&quot;},&quot;chapterTints&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;אווירה&quot;}}\">\nconst OCT7 = Date.UTC(2023, 9, 7);\nconst MONTHS = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני','ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];\n\n// Every quote below appears in the document and was cleared for\n// publication by the Prime Minister. The countdown is arithmetic on the\n// date each one was written — no editorialising, just the calendar.\nconst PROLOGUE = [\n  { d: '2023-02-12', who: 'ראש השב״כ, רונן בר', pm: false,\n    quote: 'בחדר הזה עכשיו בעזה אצל סנואר אין שום סיבה לשנות משהו... יחיא סנואר מנהיג מפוכח, הוא לא מוכן לאותה מלחמת תקומה.',\n    src: '(דיון קבינט, 12.02.2023 — פרק 4 במסמך)' },\n  { d: '2023-06-04', who: 'הרמטכ״ל, הרצל הלוי', pm: false,\n    quote: 'ההרתעה של מדינת ישראל היא תקפה מאוד, חזקה מאוד, אנחנו רואים את הסימנים האלה בחומר.',\n    src: '(הערכת מצב בראשות ראש הממשלה, 04.06.2023 — פרק 4 במסמך)' },\n  { d: '2023-09-14', who: 'תמונת מודיעין, אמ״ן', pm: false,\n    quote: 'המצב הפנימי בישראל: מעצב מרכזי בהערכת המצב של חמאס; השפעה מרסנת ברצועת עזה.',\n    src: '(מסמך אמ״ן, 14.09.2023 — נספח יב׳)' },\n  { d: '2023-09-20', who: 'אמ״ן ופיקוד הדרום', pm: false,\n    quote: 'אסטרטגיית חמאס לשימור השקט ברצועה יציבה בטווח הנראה לעין... איננו מזהים אתגר לאסטרטגיה זו.',\n    src: '(מסמך אמ״ן ופד״ם, 20.09.2023 — נספח יג׳)' },\n  { d: '2023-09-21', who: 'דו״ח מודיעין, שב״כ', pm: false,\n    quote: 'המהלך הזה לא משקף שינוי באסטרטגיה הבסיסית של חמאס, וניכר שגם כעת אין לה עניין בהידרדרות לעימות צבאי נרחב.',\n    src: '(דו״ח שב״כ, 21.09.2023 — נספח כד׳)' },\n  { d: '2023-10-03', who: 'סיכום שנתי, אמ״ן', pm: false,\n    quote: 'הפלסטינים לא יהיו הכוח המניע מאחורי מערכה רב זירתית.',\n    src: '(סיכום הערכת המודיעין השנתית, 03.10.2023 — נספח כג׳)' },\n  { d: '2023-10-03', who: 'דו״ח מודיעין, שב״כ', pm: false,\n    quote: 'חידוש ההבנות בין ישראל לחמאס... מגלם פוטנציאל לשימור היציבות ברצועה — ייתכן אף לאורך זמן.',\n    src: '(דו״ח שב״כ, 03.10.2023 — נספח כז׳)' },\n  { d: '2023-10-04', who: 'ראש השב״כ, רונן בר', pm: false,\n    quote: 'השבת השקט במרחב הגדר במסגרת ההבנות עם חמאס... הוא הישג שניתן למנפו לקידום הסדרה עמוקה יותר בזירה.',\n    src: '(סיכום ר׳ השב״כ, 04.10.2023 — נספח כח׳)' },\n  { d: '2023-10-07', who: 'ראש השב״כ — 05:15', pm: false, hours: true,\n    quote: 'יציאה למערכה רחבה — סבור כי הסיכוי לכך נמוך לאור היעדר אינדיקציה מודיעינית.',\n    src: '(סיכום הערכת מצב ר׳ השב״כ, 07.10.2023, כשעה ורבע לפני הטבח — נספח כט׳)' }\n];\n\nconst TINTS = [\n  'oklch(0.26 0.07 268)', 'oklch(0.25 0.08 258)', 'oklch(0.26 0.09 22)',\n  'oklch(0.25 0.07 210)', 'oklch(0.26 0.08 300)', 'oklch(0.25 0.075 240)',\n  'oklch(0.26 0.085 30)', 'oklch(0.27 0.10 14)',  'oklch(0.25 0.07 190)',\n  'oklch(0.22 0.04 260)', 'oklch(0.26 0.08 268)'\n];\n\nclass Component extends DCLogic {\n  // Only `data` drives rendering. Scroll progress, chapter tint, stage\n  // focus and the quote veils are mutated directly on the DOM so scrolling\n  // never triggers a React render — 325 items would otherwise tank fps.\n  state = { data: null };\n\n  constructor(props) {\n    super(props);\n    this.barRef = React.createRef();\n    this.tintRef = React.createRef();\n    this.hudRef = React.createRef();\n    this.hudDateRef = React.createRef();\n    this.hudDaysRef = React.createRef();\n    this.railRef = React.createRef();\n    this.railDotRef = React.createRef();\n    this.railFillRef = React.createRef();\n    this._railTop = {};\n    this._observed = new WeakSet();\n    this._built = null;\n    this._builtFor = null;\n  }\n\n  async componentDidMount() {\n    window.__rail = this;\n    this.hookSidecarWrites();\n    this.loadPortraits();\n    try {\n      const res = await fetch('./transcript.json');\n      this.setState({ data: await res.json() });\n    } catch (e) { console.error('transcript load failed', e); }\n\n    this._onScroll = () => {\n      if (this._ticking) return;\n      this._ticking = true;\n      requestAnimationFrame(() => {\n        this._ticking = false;\n        const h = document.documentElement;\n        const max = Math.max(1, h.scrollHeight - window.innerHeight);\n        const p = Math.min(1, Math.max(0, h.scrollTop / max));\n        if (this.barRef.current) this.barRef.current.style.width = (p * 100).toFixed(2) + '%';\n        this.sweep();\n        this.railTrack();\n        this.magnify();\n        this.updateChip();\n      });\n    };\n    // Photos can be replaced from outside this document (a drop on another\n    // page, an edit to the sidecar) — re-read whenever we regain focus.\n    this._onWake = () => { if (!document.hidden) this.loadPortraits(); };\n    window.addEventListener('focus', this._onWake);\n    document.addEventListener('visibilitychange', this._onWake);\n\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onResize = () => { clearTimeout(this._rz); this._rz = setTimeout(() => this.measureStages(), 200); };\n    window.addEventListener('resize', this._onResize);\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('focus', this._onWake);\n    document.removeEventListener('visibilitychange', this._onWake);\n    if (this._stageObs) this._stageObs.disconnect();\n    if (this._hudObs) this._hudObs.disconnect();\n    if (this._chObs) this._chObs.disconnect();\n    if (this._restoreWrite) this._restoreWrite();\n  }\n\n  componentDidUpdate() { this.wire(); }\n\n  // ── portraits ──────────────────────────────────────────────────────────\n  // One <image-slot> per speaker lives in the cast strip (unique ids); the\n  // portrait behind every quote is a plain div that mirrors the dropped\n  // image by reading the shared sidecar. Cheap DOM, no duplicate slots.\n  async loadPortraits() {\n    const map = {};\n    try {\n      const r = await fetch('./.image-slots.state.json', { cache: 'no-store' });\n      if (!r.ok) throw new Error('no sidecar');\n      const j = await r.json();\n      for (const k in j) {\n        if (k.indexOf('cast-') !== 0) continue;\n        const v = j[k];\n        const u = typeof v === 'string' ? v : (v && v.u);\n        if (u && u.indexOf('data:image/') === 0) map[k.slice(5)] = u;\n      }\n    } catch (e) { /* no sidecar yet — placeholders stay */ }\n    // Era-specific portrait shipped with the page, not user-dropped.\n    map['halevi-aman'] = './halevi-aman.png';\n    this._portraits = map;\n    this.paintPortraits();\n  }\n\n  paintPortraits() {\n    const map = this._portraits;\n    if (!map) return;\n    document.querySelectorAll('[data-portrait]').forEach((n) => {\n      const u = map[n.getAttribute('data-portrait')];\n      // Speech portraits are real <img> elements so the photo sets its own\n      // box and can never be cropped; the cast strip uses backgrounds.\n      if (n.tagName === 'IMG') {\n        if (u && n.getAttribute('src') !== u) n.src = u;\n        else if (!u && n.hasAttribute('src')) n.removeAttribute('src');\n        // Clip the print-dot screen to the photo's own alpha so a cut-out\n        // PNG stays cut out instead of sitting on a grey plate.\n        const ink = n.parentElement && n.parentElement.querySelector('[data-inkmask]');\n        if (ink) {\n          const m = u ? 'url(\"' + u + '\")' : 'none';\n          if (ink.style.maskImage !== m) {\n            ink.style.maskImage = m;\n            ink.style.webkitMaskImage = m;\n            ink.style.maskSize = '100% 100%';\n            ink.style.webkitMaskSize = '100% 100%';\n          }\n        }\n        return;\n      }\n      const want = u ? 'url(\"' + u + '\")' : '';\n      if (n.style.backgroundImage !== want) n.style.backgroundImage = want;\n    });\n  }\n\n  // Re-read the sidecar shortly after any <image-slot> persists a drop.\n  hookSidecarWrites() {\n    const om = window.omelette;\n    if (!om || typeof om.writeFile !== 'function' || om.__portraitHook) return;\n    const orig = om.writeFile.bind(om);\n    om.__portraitHook = true;\n    om.writeFile = (path, ...rest) => {\n      const out = orig(path, ...rest);\n      if (typeof path === 'string' && path.indexOf('.image-slots.state.json') !== -1) {\n        clearTimeout(this._sidecarTimer);\n        this._sidecarTimer = setTimeout(() => this.loadPortraits(), 500);\n      }\n      return out;\n    };\n    this._restoreWrite = () => { om.writeFile = orig; om.__portraitHook = false; };\n  }\n\n  // ── observers (idempotent; re-attach to any new nodes) ─────────────────\n  wire() {\n    if (!this.state.data) return;\n\n    // Dim every stage but the one you are standing in, and stage a short\n    // cut-to-the-next-speaker entrance each time one takes focus.\n    if (!this._stageObs) {\n      this._CUES = {\n        count:    'omCountIn 1100ms cubic-bezier(.16,.84,.28,1) both',\n        rule:     'omRule 900ms 300ms cubic-bezier(.16,.84,.28,1) both',\n        line:     'omLineIn 900ms 480ms cubic-bezier(.16,.84,.28,1) both',\n        portrait: 'omPortraitIn 1000ms cubic-bezier(.16,.84,.28,1) both',\n        sweep:    'omSweep 900ms 60ms cubic-bezier(.3,.7,.3,1) both',\n        label:    'omWipeIn 560ms 140ms cubic-bezier(.2,.9,.2,1) both',\n        quote:    'omQuoteIn 820ms 230ms cubic-bezier(.16,.84,.28,1) both',\n        meta:     'omMetaIn 700ms 520ms ease both'\n      };\n      this._stageObs = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          const el = e.target;\n          if (e.isIntersecting) {\n            el.style.opacity = '1';\n            // Reveal the quote tail here rather than from a separate\n            // observer: content-visibility:auto makes one-shot offscreen\n            // callbacks unreliable, and this path fires for every stage.\n            this.cue(el);\n          } else {\n            el.style.opacity = '0.3';\n          }\n        }\n      }, { rootMargin: '-22% 0px -26% 0px', threshold: 0 });\n    }\n\n    // Dated items drive the countdown chip — quotes, claims and memos too,\n    // not only the speech stages.\n    if (!this._hudObs) {\n      this._hudLive = new Set();\n      this._hudObs = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          if (e.isIntersecting) this._hudLive.add(e.target);\n          else this._hudLive.delete(e.target);\n        }\n        const mid = window.innerHeight / 2;\n        let best = null, bestD = Infinity;\n        this._hudLive.forEach((n) => {\n          const r = n.getBoundingClientRect();\n          const d = Math.abs((r.top + r.bottom) / 2 - mid);\n          if (d < bestD) { bestD = d; best = n; }\n        });\n        if (best) this.showHud(best);\n      }, { rootMargin: '-18% 0px -34% 0px', threshold: 0 });\n    }\n\n    if (!this._chObs) {\n      this._chObs = new IntersectionObserver((entries) => {\n        for (const e of entries) {\n          if (!e.isIntersecting) continue;\n          const t = e.target.getAttribute('data-tint');\n          if (t && t !== 'transparent' && this.tintRef.current && this._tint !== t) {\n            this._tint = t;\n            this.tintRef.current.style.background =\n              'radial-gradient(120% 85% at 82% 0%, ' + t + ', transparent 66%), #04081a';\n          }\n        }\n      }, { rootMargin: '-45% 0px -50% 0px' });\n    }\n\n    const attach = (sel, obs) => {\n      document.querySelectorAll(sel).forEach((n) => {\n        const seen = this._observed.has(n) && n.__omObs === obs;\n        if (seen) return;\n        this._observed.add(n);\n        n.__omObs = obs;\n        obs.observe(n);\n      });\n    };\n    attach('[data-stage]', this._stageObs);\n    attach('[data-beat]', this._stageObs);\n    attach('[data-uid][data-date]:not([data-date=\"\"])', this._hudObs);\n    attach('[data-chapter]', this._chObs);\n\n    this.paintPortraits();\n\n    // Measure once the tree exists, then again after webfonts settle —\n    // Heebo swapping in reflows every stage.\n    // Re-measure until the mark table matches the built data — the first\n    // update can land before the transcript has been folded in.\n    const want = (this._markPcts || []).length;\n    if (!this._measured || (this._marks || []).length !== want) {\n      this._measured = true;\n      this.measureStages();\n      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.measureStages());\n      setTimeout(() => this.measureStages(), 1200);\n    }\n  }\n\n  // Fire a stage's entrance once. Idempotent — the scroll sweep and the\n  // observer both call it; whoever gets there first wins.\n  cue(el) {\n    const veil = el.querySelector('[data-veil]');\n    if (veil) veil.style.opacity = '0';\n    const uidNode = el.closest('[data-uid]');\n    if (uidNode) this.showHud(uidNode);\n    if (el.__cued) return;\n    el.__cued = true;\n    const CUES = this._CUES || {};\n    el.querySelectorAll('[data-anim]').forEach((n) => {\n      const anim = CUES[n.getAttribute('data-anim')];\n      if (anim) { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = anim; }\n    });\n  }\n\n  // IntersectionObserver deliveries can be coalesced away when a stage\n  // transits the band inside a single tick — at flick speed most stages\n  // were never reported. The authoritative pass is this monotonic sweep\n  // over pre-measured midpoints: a forward-only cursor, so it is O(1) per\n  // frame and physically cannot skip a stage.\n  measureStages() {\n    const nodes = document.querySelectorAll('[data-stage],[data-beat]');\n    if (!nodes.length) return;\n    const y = window.scrollY || document.documentElement.scrollTop;\n    this._stages = [...nodes].map((el) => {\n      const r = el.getBoundingClientRect();\n      return { el, mid: r.top + y + r.height / 2 };\n    }).sort((a, b) => a.mid - b.mid);\n    this._cursor = 0;\n\n    // Document positions of every dated item, for the continuous marker.\n    this._marks = (this._markPcts || []).map((m) => {\n      const n = document.querySelector('[data-uid=\"' + m.uid + '\"]');\n      if (!n) return null;\n      const r = n.getBoundingClientRect();\n      return { y: r.top + y + r.height / 2, pct: m.pct };\n    }).filter(Boolean).sort((a, b) => a.y - b.y);\n\n    this.sweep();\n    this.railTrack();\n  }\n\n  sweep() {\n    const list = this._stages;\n    if (!list) return;\n    const limit = (window.scrollY || document.documentElement.scrollTop) + window.innerHeight * 0.82;\n    while (this._cursor < list.length && list[this._cursor].mid <= limit) {\n      this.cue(list[this._cursor].el);\n      this._cursor++;\n    }\n  }\n\n  // The running countdown chip. Only shows while the item in focus carries\n  // a date, so it never displays a stale number.\n  showHud(node) {\n    const hud = this.hudRef.current;\n    if (!hud) return;\n    const date = node && node.getAttribute('data-date');\n    const days = node && node.getAttribute('data-days');\n    // Latch the last dated item: undated prose between quotes shouldn't\n    // drop the reader out of the timeline.\n    if (!date) return;\n    // Compact readouts: the chip now lives inside the timeline gutter, so\n    // it shows instrument values; the full date rides the rail tooltips.\n    if (this.hudDateRef.current) this.hudDateRef.current.textContent = node.getAttribute('data-date') || date;\n    if (this.hudDaysRef.current) this.hudDaysRef.current.textContent = node.getAttribute('data-daysnum') || (days || '—');\n    hud.style.opacity = '1';\n    hud.style.transform = 'none';\n\n    // Slide the timeline marker to this document's place on the rail.\n    if (this.railRef.current) this.railRef.current.style.opacity = '1';\n    const dot = this.railDotRef.current;\n    const top = this._railTop[node.getAttribute('data-uid')];\n    if (!top) return;\n\n    // Light the stop the reader is standing on, dim the rest.\n    this.emphasise(node.getAttribute('data-daysnum'));\n  }\n\n  // The marker rides the rail continuously: its position is interpolated\n  // between the document positions of the dated items, so it glides with\n  // the scroll instead of snapping between the 12 stops.\n  railTrack() {\n    const m = this._marks;\n    if (!m || !m.length) return;\n    const c = (window.scrollY || document.documentElement.scrollTop) + window.innerHeight * 0.42;\n    let i = 0;\n    while (i < m.length && m[i].y < c) i++;\n    let pct, item = m[0];\n    if (i === 0) pct = m[0].pct;\n    else if (i >= m.length) { pct = m[m.length - 1].pct; item = m[m.length - 1]; }\n    else {\n      const a = m[i - 1], b = m[i];\n      const t = Math.max(0, Math.min(1, (c - a.y) / Math.max(1, b.y - a.y)));\n      pct = a.pct + (b.pct - a.pct) * t;\n      item = t < 0.5 ? a : b;\n    }\n    this._currentMark = item;\n    const dated = item.uid ? [...document.querySelectorAll('[data-uid]')].find(n => n.getAttribute('data-uid') === item.uid) : null;\n    let dotPct = pct;\n    if (dated) {\n      this.showHud(dated);\n      const railTop = this._railTop[item.uid];\n      if (railTop) dotPct = parseFloat(railTop);\n    }\n    this._centerPct = dotPct;\n    const s = dotPct.toFixed(3) + '%';\n    if (this.railDotRef.current) {\n      this.railDotRef.current.style.top = s;\n      this.railDotRef.current.style.opacity = '1';\n    }\n    if (this.railFillRef.current) this.railFillRef.current.style.height = s;\n    if (this.railRef.current) this.railRef.current.style.opacity = '1';\n    this.showHudForMark(item);\n  }\n  \n  showHudForMark(item) {\n    if (!item || !item.uid) return;\n    const dated = [...document.querySelectorAll('[data-uid]')].find(n => n.getAttribute('data-uid') === item.uid);\n    if (dated) this.showHud(dated);\n  }\n\n  // Dock-style magnification: stops swell as the marker nears them and\n  // fall off smoothly with distance along the rail.\n  magnify() {\n    const rail = this.railRef.current;\n    if (!rail || this._centerPct == null) return;\n    if (!this._stops) {\n      this._stops = [...rail.querySelectorAll('button')].map((b) => ({\n        b, top: parseFloat(b.style.top)\n      }));\n      if (!this._stops.length) { this._stops = null; return; }\n    }\n    const R = 14;\n    for (const s of this._stops) {\n      const d = Math.abs(s.top - this._centerPct);\n      let w = Math.max(0, 1 - d / R);\n      w = w * w * (3 - 2 * w);\n      s.b.style.transformOrigin = 'right center';\n      // Capped so a magnified stop still fits the reserved gutter and can\n      // never grow out over the page text.\n      s.b.style.transform = 'scale(' + (1 + 0.34 * w).toFixed(3) + ')';\n      s.b.style.opacity = (0.42 + 0.58 * w).toFixed(3);\n      s.b.style.zIndex = w > 0.04 ? '2' : '1';\n    }\n  }\n\n  // Update the chip (date & countdown) to match the current scroll position.\n  updateChip() {\n    const m = this._marks;\n    if (!m || !m.length || !this.hudDateRef.current) return;\n    const c = (window.scrollY || document.documentElement.scrollTop) + window.innerHeight * 0.42;\n    let item = m[0];\n    for (const mk of m) {\n      if (Math.abs(mk.y - c) < Math.abs(item.y - c)) item = mk;\n    }\n    const dated = [...document.querySelectorAll('[data-uid][data-date]')].find(n => n.getAttribute('data-uid') === item.uid);\n    if (dated) {\n      const d = dated.getAttribute('data-daysnum');\n      const dt = dated.getAttribute('data-date');\n      if (dt) this.hudDateRef.current.textContent = dt.split('-').reverse().join('.');\n      this.emphasise(d);\n    }\n  }\n\n  // The countdown itself tightens: the closer the document sits to\n  // 7 October, the larger and hotter the number reads.\n  emphasise(raw) {\n    const el = this.hudDaysRef.current;\n    if (!el || !raw) return;\n    const days = Math.abs(parseInt(String(raw).replace(/[^0-9]/g, ''), 10) || 0);\n    const p = 1 - Math.min(1, days / 420);\n    const eased = p * p;\n    el.style.fontSize = (12 + 20 * eased).toFixed(1) + 'px';\n    el.style.lineHeight = '1.05';\n    el.style.color = eased > 0.55 ? '#ffffff' : '#ff5a6e';\n    el.style.textShadow = eased > 0.15 ? '0 0 ' + (6 + 22 * eased).toFixed(0) + 'px rgba(255,60,84,' + (0.45 + 0.5 * eased).toFixed(2) + ')' : 'none';\n    const cell = el.parentElement;\n    if (cell) cell.style.background = 'rgba(200,16,46,' + (0.18 + 0.5 * eased).toFixed(3) + ')';\n  }\n\n  // A torn-paper edge as a clip-path: deterministic jitter along the top\n  // and bottom so every document card reads as a strip torn out of the\n  // original. Computed once, never per frame.\n  static tornClip() {\n    const rnd = (i) => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };\n    const n = 44, amp = 2.1, pts = [];\n    for (let i = 0; i <= n; i++) {\n      pts.push((i / n * 100).toFixed(2) + '% ' + (rnd(i) * amp).toFixed(2) + '%');\n    }\n    for (let i = n; i >= 0; i--) {\n      pts.push((i / n * 100).toFixed(2) + '% ' + (100 - rnd(i + 97) * amp).toFixed(2) + '%');\n    }\n    return 'polygon(' + pts.join(',') + ')';\n  }\n\n  // Days between a dd.mm.yyyy string and 7 Oct 2023, plus a Hebrew date.\n  static dateInfo(iso) {\n    const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(iso);\n    if (!m) return null;\n    const y = +m[1], mo = +m[2] - 1, day = +m[3];\n    const days = Math.round((OCT7 - Date.UTC(y, mo, day)) / 86400000);\n    return { label: day + ' ' + MONTHS[mo] + ' ' + y, days, iso };\n  }\n\n  static findDate(it, chapterId) {\n    const hay = (it.source || '') + ' ' + (it.text || '') + ' ' + (it.title || '');\n    const m = /(\\d{2})\\.(\\d{2})\\.(\\d{4})/.exec(hay);\n    if (m) return Component.dateInfo(m[3] + '-' + m[2] + '-' + m[1]);\n    // The 7 October chapter is timestamped by clock time, not by date.\n    if (chapterId === 'oct7') return Component.dateInfo('2023-10-07');\n    return null;\n  }\n\n  // ── render inputs, built once per data/props change ────────────────────\n  build() {\n    const d = this.state.data;\n    const showSources = this.props.showSources !== false;\n    const tinted = this.props.chapterTints !== false;\n    const cacheKey = (d ? 'data' : 'empty') + '|' + showSources + '|' + tinted;\n    if (this._built && this._builtFor === cacheKey) return this._built;\n\n    const speakers = (d && d.speakers) || {};\n    const chapters = [];\n    const toc = [];\n    const cast = [];\n    const seenSpeaker = {};\n    let uid = 0;\n\n    if (d) {\n      d.chapters.forEach((ch, idx) => {\n        let ctxIso = '';\n        const anchor = 'ch-' + ch.id;\n        const num = String(ch.n).padStart(2, '0');\n        if (ch.n > 0) {\n          toc.push({ anchor, num, title: ch.title.length > 44 ? ch.title.slice(0, 42) + '…' : ch.title });\n        }\n        chapters.push({\n          idx, anchor, num, label: num, numbered: ch.n > 0,\n          tint: tinted ? TINTS[idx % TINTS.length] : 'transparent',\n          title: ch.title, page: ch.page || '',\n          hasQuestions: !!(ch.questions && ch.questions.length),\n          questions: ch.questions || [],\n          items: (ch.items || []).map((it) => {\n            const key = 'L' + (++uid);\n            const isSpeech = it.kind === 'speech';\n\n            // The document quotes \"ראש אמ״ן\" without naming him. Herzi\n            // Halevi held the post from September 2014 to March 2018, so\n            // quotes from that window are attributed to him by name and\n            // portrait; later ones stay unattributed.\n            const di = Component.findDate(it, ch.id);\n            if (di) ctxIso = di.iso;\n            let speakerKey = it.speaker;\n            let portraitKey = it.speaker;\n            if (isSpeech && speakerKey === 'aman' && ctxIso &&\n                ctxIso >= '2014-09-01' && ctxIso <= '2018-03-31') {\n              speakerKey = 'halevi';\n              // His own AMAN-era photo, used only on these quotes — the\n              // cast strip keeps his Chief-of-Staff portrait.\n              portraitKey = 'halevi-aman';\n            }\n\n            const sp = speakerKey ? speakers[speakerKey] : null;\n            const isPm = isSpeech && speakerKey === 'netanyahu';\n            const raw = it.text || '';\n            if (isSpeech && speakerKey && !seenSpeaker[speakerKey]) {\n              seenSpeaker[speakerKey] = true;\n              const firstUid = key;\n              cast.push({\n                key: speakerKey,\n                name: sp ? sp.name : speakerKey,\n                role: sp ? sp.role : '',\n                jumpTitle: 'לציטוט הראשון של ' + (sp ? sp.name : speakerKey),\n                go: () => {\n                  const el = document.querySelector('[data-uid=\"' + firstUid + '\"]');\n                  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.12, behavior: 'smooth' });\n                }\n              });\n            }\n            return {\n              uid: key,\n              speaker: isSpeech ? (speakerKey || 'none') : 'none',\n              portrait: isSpeech ? (portraitKey || 'none') : 'none',\n              isSpeech,\n              isClaim: it.kind === 'claim',\n              isQuote: it.kind === 'quote',\n              isHeading: it.kind === 'heading',\n              isList: it.kind === 'list',\n              isTimeline: it.kind === 'timeline',\n              isNote: it.kind === 'note',\n              isStage: it.kind === 'stage',\n              isSource: it.kind === 'source' && showSources,\n              isRedacted: it.kind === 'redacted',\n              tagBg: isPm ? '#c8102e' : '#3d4f8f',\n              name: sp ? sp.name : '',\n              role: it.role || (sp ? sp.role : ''),\n              text: raw,\n              quoted: isSpeech ? '\\u201D' + raw + '\\u201C' : raw,\n              title: it.title || '',\n              time: it.time || '',\n              note: it.note || '',\n              source: showSources ? (it.source || '') : '',\n              items: it.items || [],\n              dateLabel: (function () { const di = Component.findDate(it, ch.id); return di ? di.label : ''; })(),\n              sortKey: (function () {\n                const di = Component.findDate(it, ch.id);\n                return di ? di.iso : '';\n              })(),\n              dateShort: (function () {\n                const di = Component.findDate(it, ch.id);\n                if (!di) return '';\n                const p = di.iso.split('-');\n                return p[2] + '.' + p[1] + '.' + p[0].slice(2);\n              })(),\n              daysNum: (function () {\n                const di = Component.findDate(it, ch.id);\n                if (!di) return '';\n                if (di.days === 0) return '0';\n                return (di.days > 0 ? '' : '+') + Math.abs(di.days).toLocaleString('he-IL');\n              })(),\n              daysLabel: (function () {\n                const di = Component.findDate(it, ch.id);\n                if (!di) return '';\n                if (di.days > 0) return di.days.toLocaleString('he-IL') + ' ימים לפני';\n                if (di.days === 0) return 'אותו היום';\n                return Math.abs(di.days).toLocaleString('he-IL') + ' ימים אחרי';\n              })()\n            };\n          })\n        });\n      });\n      cast.unshift({\n        key: 'comptroller', name: 'מתניהו אנגלמן', role: 'מבקר המדינה',\n        jumpTitle: 'לשאלות הביקורת הראשונות',\n        go: () => {\n          const el = document.getElementById('ch-policy-gaza');\n          if (el) el.scrollIntoView({ behavior: 'smooth' });\n        }\n      });\n    }\n\n    const prologue = PROLOGUE.map((p, i) => {\n      const di = Component.dateInfo(p.d);\n      const near = di ? Math.max(0, Math.min(1, 1 - di.days / 240)) : 1;\n      const red = 0.05 + near * 0.30;\n      return {\n        who: p.who,\n        quote: p.quote,\n        src: p.src,\n        date: di ? di.label : '',\n        days: p.hours ? '05:15' : (di ? String(di.days) : ''),\n        unit: p.hours ? 'בבוקר — כשעה ורבע לפני תחילת המתקפה' : (di && di.days === 1 ? 'יום לפני ה־7 באוקטובר' : 'ימים לפני ה־7 באוקטובר'),\n        bg: 'radial-gradient(120% 90% at 78% 8%, rgba(200,16,46,' + red.toFixed(3) + '), transparent 64%), #000',\n        glow: 'rgba(200,16,46,' + (0.12 + near * 0.34).toFixed(3) + ')',\n        numColor: near > 0.86 ? '#ff5a6e' : '#ffffff',\n        tagBg: p.pm ? '#c8102e' : '#3d4f8f'\n      };\n    });\n\n    // ── the timeline rail ────────────────────────────────────────────────\n    // Every dated document in the answer, ordered by its own date and\n    // spaced evenly so the 2023 cluster stays legible next to 2014.\n    const dated = [];\n    chapters.forEach((ch) => ch.items.forEach((it) => {\n      if (it.dateLabel && it.sortKey) dated.push(it);\n    }));\n    dated.sort((a, b) => (a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0));\n    // Rail position tracks a document's ordinal place in the sequence, not\n    // its group, so the marker advances evenly instead of stalling on the\n    // collapsed 2014–2020 stop and then racing.\n    const span = Math.max(1, dated.length - 1);\n    dated.forEach((it, idx) => { it._pct = (idx / span) * 92; });\n\n    // Aggregated so every stop is a real hit target: one stop per year up\n    // to 2022, then one per month through 2023 as the countdown tightens.\n    const groups = [];\n    const byKey = {};\n    dated.forEach((it) => {\n      const year = it.sortKey.slice(0, 4);\n      const key = year === '2023' ? it.sortKey.slice(0, 7) : year;\n      if (!byKey[key]) {\n        byKey[key] = { key, year, month: year === '2023' ? +it.sortKey.slice(5, 7) : 0, is23: year === '2023', items: [] };\n        groups.push(byKey[key]);\n      }\n      byKey[key].items.push(it);\n    });\n    // Add 2023 as top-level stop before months\n    const months23 = Object.keys(byKey).filter(k => k.startsWith('2023-')).sort();\n    if (months23.length > 0) {\n      const first23 = byKey[months23[0]];\n      const all23Items = [];\n      months23.forEach(k => all23Items.push(...(byKey[k].items || [])));\n      const idx = groups.findIndex(g => g.key === months23[0]);\n      if (idx >= 0) {\n        groups.splice(idx, 0, { key: '2023', year: '2023', month: 0, is23: true, is23Year: true, items: all23Items });\n      }\n    }\n\n    const railTop = {};\n    const markList = [];\n    const timeline = [];\n    const SHORT = ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];\n    const stopH = 100 / Math.max(1, groups.length);\n    groups.forEach((g, i) => {\n      // Even spacing between all stops (years + months).\n      const top = (i * stopH).toFixed(3) + '%';\n      g.items.forEach((it) => { railTop[it.uid] = top; markList.push({ uid: it.uid, pct: it._pct }); });\n      const is23 = g.is23;\n      const first = g.items[0];\n      const isYear = !is23;\n      timeline.push({\n        top,\n        dateShort: first.dateShort || '',\n        title: (g.is23Year ? '2023' : is23 ? SHORT[g.month - 1] + ' 2023' : g.year) + ' · ' +\n               g.items.length + ' מסמכים · ' + first.daysLabel,\n        yearLabel: g.is23Year ? '2023' : is23 ? SHORT[g.month - 1] : g.year,\n        tickW: is23 ? '24px' : isYear ? '12px' : '16px',\n        tickH: is23 ? '3px' : isYear ? '2px' : '3px',\n        tickInset: '2px',\n        tickColor: is23 ? '#ff5a6e' : 'rgba(139,151,196,0.65)',\n        labelColor: is23 ? '#ff5a6e' : '#b8c1d8',\n        labelSize: is23 ? '13px' : '12px',\n        delay: (0.35 + i * 0.045).toFixed(3) + 's',\n        go: () => {\n          const el = document.querySelector('[data-uid=\"' + first.uid + '\"]');\n          if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - window.innerHeight * 0.32, behavior: 'smooth' });\n        }\n      });\n    });\n    this._railTop = railTop;\n    this._markPcts = markList;\n\n    this._built = { chapters, toc, cast, prologue, timeline };\n    this._builtFor = cacheKey;\n    return this._built;\n  }\n\n  renderVals() {\n    const b = this.build();\n    return {\n      chapters: b.chapters,\n      toc: b.toc,\n      cast: b.cast,\n      prologue: b.prologue,\n      timeline: b.timeline,\n      railRef: this.railRef,\n      railDotRef: this.railDotRef,\n      railFillRef: this.railFillRef,\n      hudDateRef: this.hudDateRef,\n      tornClip: Component.tornClip(),\n      barRef: this.barRef,\n      tintRef: this.tintRef,\n      hudRef: this.hudRef,\n      hudDateRef: this.hudDateRef,\n      hudDaysRef: this.hudDaysRef\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
